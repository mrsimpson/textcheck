# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# The mode "Original erkennen", Fledermäuse, grades 5 and 6, seed 23. This mode builds no spelling errors: the errors are
# "sechs bis zehn Monate" (words 64 to 67, a wrong time), "mehrere Junge" (words 75 and 76, a contradiction) and an added
# sentence. The Variante is text A. The learner first picks text B (the Original), changes the pick to text A, marks two of the three errors and
# checks: the pick is right, two errors are found.
route: klasse-5-6-original
seed: 23
steps:
  - inputs: [{ kind: action, name: choose, value: b }]
    state:
      mode: choose
      variantSide: a
      choice: b
      marked: []
      last: choose
    announce: "Text B gewählt. Markiere dort die Wörter, die nicht stimmen."
  - inputs: [{ kind: key, key: "1" }]
    state: { choice: a, last: choose }
    announce: "Text A gewählt. Markiere dort die Wörter, die nicht stimmen."
  - inputs:
      - { kind: action, name: toggle, value: 64 }
      - { kind: action, name: toggle, value: 75 }
    state: { marked: [64, 75], last: mark }
    announce: "mehrere markiert. 2 markiert."
  - inputs: [{ kind: action, name: check }]
    state:
      phase: result
      result:
        total: 3
        found: 2
        wrong: 0
        chosenRight: true
    announce: "Geprüft: 2 von 3 Fehlern gefunden. Fälschlich markiert: 0."
