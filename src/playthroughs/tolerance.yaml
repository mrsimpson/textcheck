# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# A round of the comparison with a source, first stage, with the Biber text (seed 7). Its errors: "Meeren" (word 11),
# "ein Jahr lang" (words 70 to 72, tolerance 1) and "dreizehn" (word 76). One word of the long error is a hit; the word
# before it and the word after it, in its sentence, are within the tolerance; a word of another sentence is wrong; the
# error "dreizehn" is missed.
route: quelle-1
seed: 7
steps:
  - inputs: [{ kind: action, name: begin }, { kind: action, name: view, value: rendition }]
    state: { phase: marking, view: rendition, packId: biber }
  - inputs:
      - { kind: action, name: toggle, value: 71 }
      - { kind: action, name: toggle, value: 69 }
      - { kind: action, name: toggle, value: 73 }
      - { kind: action, name: toggle, value: 11 }
      - { kind: action, name: toggle, value: 30 }
    state: { marked: [11, 30, 69, 71, 73] }
  - inputs: [{ kind: action, name: check }]
    state:
      phase: result
      result: { total: 3, found: 2, wrong: 1, tolerated: 2 }
    announce: "Geprüft: 2 von 3 Fehlern gefunden. Fälschlich markiert: 1."
