# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# The mode "Original erkennen", seed 23: the Variante is text A, but the learner picks text B, which is the Original,
# marks its first word and checks. The pick is wrong, no error is found, the mark counts as wrong.
route: klasse-5-6-original
seed: 23
steps:
  - inputs:
      - { kind: key, key: "2" }
      - { kind: action, name: toggle, value: 0 }
    state: { choice: b, marked: [0], last: mark }
    announce: "Fledermäuse markiert. 1 markiert."
  - inputs: [{ kind: action, name: check }]
    state:
      phase: result
      result:
        total: 3
        found: 0
        wrong: 1
        chosenRight: false
    announce: "Geprüft: 0 von 3 Fehlern gefunden. Fälschlich markiert: 1."
