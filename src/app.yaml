# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title:
  de: Textcheck
  en: Textcheck
description:
  de: |
    Hier übst du, genau zu lesen. Es gibt zwei Arten: Du findest Fehler in einem Text, den du allein vor dir hast. Oder
    du vergleichst eine Wiedergabe mit ihrer Quelle und findest, was beim Übertragen falsch geworden ist. Jede Art hat
    drei Stufen. Mit der Stufe werden die Texte länger, die Fehlerarten mehr und die Hilfen weniger. Für Schülerinnen
    und Schüler ab Klasse 3 bis zum Abitur.
  en: |
    Here you practise careful reading. There are two kinds: you find errors in a text you have in front of you alone, or you compare a rendition with its source and find what went wrong when it was passed on. Each kind has three stages. With each stage the texts get longer, the kinds of error more and the help less. For pupils from grade 3 to the Abitur in the German school system.
howto:
  de: |
    - Wähl, was du üben willst: Fehler im Text finden oder mit der Quelle vergleichen. Danach wählst du eine Stufe. Die Karte
      der Stufe sagt dir, wie lang die Texte sind, welche Fehlerarten vorkommen und welche Hilfen es gibt.
    - Lies den Tipp zum Lesen. Er sagt dir, worauf du bei dieser Übung achtest.
    - Markiere die Wörter, die nicht stimmen. Du markierst mit einem Klick oder Tipp, mit der Tastatur wählst du Wörter mit
      den Pfeiltasten und markierst mit der Leertaste.
    - Beim Vergleichen mit der Quelle liest du erst die Quelle und blätterst dann zur Wiedergabe. In der schwersten Stufe ist
      die Quelle der echte Artikel auf einer Internetseite.
    - Tippe auf „Prüfen“. Du siehst, welche Fehler du gefunden hast, welche nicht, und warum. Dann schlägt die Übung vor, wie es
      weitergeht.
    - Ein paar Wörter zu viel zu markieren ist nicht schlimm, wenn sie direkt neben einem langen Fehler im selben Satz stehen.
  en: |
    - Choose what you want to practise: find errors in a text, or compare with the source. Then choose a stage. The card of the stage tells you how long the texts are, which kinds of error occur and what help there is.
    - Read the tip on how to read. It tells you what to look out for in this exercise.
    - Mark the words that are wrong. You mark with a click or a tap; with the keyboard you choose words with the arrow keys and mark with the space bar.
    - When you compare with the source, you read the source first and then turn to the rendition. In the hardest stage the source is the real article on a web page.
    - Tap "Check". You see which errors you found, which you missed, and why they are wrong. Then the exercise suggests what to do next.
    - It is fine to mark a few extra words if they stand right next to a long error in the same sentence.
competencies:
  - de: Ich kann falsch geschriebene Wörter in einem Text finden und markieren.
    en: I can find misspelt words in a text and mark them.
  - de: Ich kann falsch geschriebene Wörter finden, auch solche, die ein Rechtschreibprogramm nicht findet.
    en: I can find misspelt words, even ones a spell checker does not find.
  - de: Ich kann Sätze finden, die sich im selben Text widersprechen.
    en: I can find sentences that contradict each other in the same text.
  - de: Ich kann einen Text mit seiner Quelle vergleichen und Zahlen, Namen, Orte und Angaben finden, die von der Quelle abweichen.
    en: I can compare a text with its source and find numbers, names, places and details that differ from the source.
  - de: Ich kann in einer Wiedergabe erkennen, was die Quelle nicht sagt, also Verallgemeinerungen, Folgerungen und Meinungen, die als Tatsachen auftreten.
    en: I can recognise in a rendition what the source does not say, such as overgeneralisations, conclusions and opinions that pose as facts.
  - de: Ich kann wertende oder emotionalisierende Formulierungen erkennen.
    en: I can recognise judging or emotional wording.
languages:
  - de
  - en
routes:
  - id: start
    title:
      de: Übung wählen
      en: Choose an exercise
    description:
      de: Fehler im Text finden oder mit der Quelle vergleichen.
      en: Find errors in a text or compare with the source.
  - id: text
    title:
      de: Fehler im Text finden, Stufen
      en: Find errors in a text, stages
    description:
      de: Ein Text, keine Vorlage. Drei Stufen von Rechtschreibung bis zu Widersprüchen im Text.
      en: One text, nothing to compare it with. Three stages from spelling to contradictions in the text.
  - id: text-1
    title:
      de: Fehler im Text finden, Stufe 1
      en: Find errors in a text, stage 1
    description:
      de: Kurzer Text. Rechtschreibung und Flüchtigkeitsfehler.
      en: Short text. Spelling and slips.
  - id: text-2
    title:
      de: Fehler im Text finden, Stufe 2
      en: Find errors in a text, stage 2
    description:
      de: Längerer Text. Dazu Zeichensetzung und Fehler mit echten Wörtern.
      en: Longer text. Also punctuation and mistakes with real words.
  - id: text-3
    title:
      de: Fehler im Text finden, Stufe 3
      en: Find errors in a text, stage 3
    description:
      de: Langer Text. Dazu Sätze, die sich widersprechen. Die Fehlerarten werden nicht genannt.
      en: Long text. Also sentences that contradict each other. The kinds of error are not named.
  - id: quelle
    title:
      de: Mit der Quelle vergleichen, Stufen
      en: Compare with the source, stages
    description:
      de: Wiedergabe und Quelle. Drei Stufen von Zahlen und Namen bis zu Meinungen, die als Tatsachen auftreten.
      en: Rendition and source. Three stages from numbers and names to opinions that pose as facts.
  - id: quelle-1
    title:
      de: Mit der Quelle vergleichen, Stufe 1
      en: Compare with the source, stage 1
    description:
      de: Kurzer Text. Zahlen, Namen, Daten und Orte.
      en: Short text. Numbers, names, dates and places.
  - id: quelle-2
    title:
      de: Mit der Quelle vergleichen, Stufe 2
      en: Compare with the source, stage 2
    description:
      de: Längerer Text. Dazu falsche und hinzugefügte Angaben, Verneinungen, Mengen und Grade.
      en: Longer text. Also wrong and added details, negations, amounts and degrees.
  - id: quelle-3
    title:
      de: Mit der Quelle vergleichen, Stufe 3
      en: Compare with the source, stage 3
    description:
      de: Langer Text, die Quelle ist der echte Artikel. Dazu Verallgemeinerungen, Folgerungen, Meinungen und Wertungen.
      en: Long text, the source is the real article. Also overgeneralisations, conclusions, opinions and loaded wording.
