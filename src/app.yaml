sections:
  - id: begruendung
    title:
      de: Wie diese Übung begründet ist
      en: How this exercise is grounded
    text:
      de: |
        Hier steht, woran wir uns halten und was wir selbst abgeleitet haben. **Belegt** heißt: Eine Quelle, die wir gelesen
        haben, nennt diese Fehlerart. **Abgeleitet** heißt: ein eigener Schluss aus verwandten Quellen. Ab welcher Klasse
        eine Fehlerart vorkommt, ist unsere Einstellung. Keine der gelesenen Quellen ordnet die Fehlerarten Klassenstufen zu.

        Die Fehlerarten:

        - **Rechtschreibung (Regelfehler)**, belegt, ab Klasse 3: IQB-Lernaufgabe und -Handreichung, KMK-Standards.
        - **Flüchtigkeitsfehler**, belegt, ab Klasse 3: Schmellentin und Lindauer (2019).
        - **Fehler mit echtem Wort (das/dass, das fahren)**, belegt, ab Klasse 5: IQB-Handreichung und -Lernaufgabe.
        - **Zeichensetzung**, abgeleitet, ab Klasse 3: KMK-Standards, Schmellentin und Lindauer.
        - **Zahl, Name, Datum oder Ort verändert**, abgeleitet, ab Klasse 3: IGLU 2021, KMK-Standards.
        - **Sachlich falsche Angabe**, abgeleitet, ab Klasse 5: IGLU 2021, Cook, Ellerton und Kinkead (2018).
        - **Hinzugefügte Aussage**, abgeleitet, ab Klasse 5: Voss, Carstensen und Bos (2005).
        - **Verbindung oder Verneinung verändert**, abgeleitet, ab Klasse 5: Voss, Carstensen und Bos (2005).
        - **Widerspruch im Text**, abgeleitet, ab Klasse 5: Voss, Carstensen und Bos (2005), KMK-Standards.
        - **Menge oder Grad verändert**, abgeleitet, ab Klasse 7: eigener Schluss, keine Quelle gelesen.
        - **Verallgemeinerung**, abgeleitet, ab Klasse 7: Cook, Ellerton und Kinkead (2018).
        - **Falsche Folgerung oder Ursache**, abgeleitet, ab Klasse 7: Cook, Ellerton und Kinkead (2018), IGLU 2021.
        - **Meinung als Tatsache**, abgeleitet, ab Klasse 7: IGLU 2021, Voss, Carstensen und Bos (2005), KMK-Standards.
        - **Falsche Autorität oder Quelle**, abgeleitet, ab Klasse 10: Cook, Lewandowsky und Ecker (2017).
        - **Wertende, emotionalisierende Beeinflussung**, abgeleitet, ab Klasse 10: IGLU 2021, KMK-Standards, Cook und andere (2017).

        Was wir nicht belegen können:

        - Dass diese Übung die Lesekompetenz verbessert. Dafür gibt es keine Studie.
        - Dass Fehlersuche in Texten das Prüfen unbekannter Webseiten übt. Das ist etwas anderes (Wineburg und McGrew 2018).
        - Die Länge und den Satzbau der Texte je Klassenstufe: Das sind Einstellungen der Autorinnen und Autoren.
        - Die Fehler bei der Rechtschreibung sind für die Wörter der Texte konstruiert. Die Arten der Fehler stammen aus den
          IQB-Materialien, die einzelnen Falschschreibungen von Lernenden haben wir nicht gesammelt.
      en: |
        Here we say what we rely on and what we worked out ourselves. **Documented** means: a source we read names this kind of error. **Derived** means: our own conclusion from related sources. From which grade a kind of error occurs is our own setting. None of the sources we read assigns the kinds of error to grades.

        The kinds of error:

        - **Spelling (rule-based mistake)**, documented, from grade 3: IQB learning task and handbook, KMK standards.
        - **Slip of the pen**, documented, from grade 3: Schmellentin and Lindauer (2019).
        - **Mistake with a real word (their/there, its/it's)**, documented, from grade 5: IQB handbook and learning task.
        - **Punctuation**, derived, from grade 3: KMK standards, Schmellentin and Lindauer.
        - **Number, name, date or place changed**, derived, from grade 3: IGLU 2021, KMK standards.
        - **Wrong fact**, derived, from grade 5: IGLU 2021, Cook, Ellerton and Kinkead (2018).
        - **Added statement**, derived, from grade 5: Voss, Carstensen and Bos (2005).
        - **Connective or negation changed**, derived, from grade 5: Voss, Carstensen and Bos (2005).
        - **Contradiction in the text**, derived, from grade 5: Voss, Carstensen and Bos (2005), KMK standards.
        - **Amount or degree changed**, derived, from grade 7: our own inference, no source read.
        - **Overgeneralisation**, derived, from grade 7: Cook, Ellerton and Kinkead (2018).
        - **Faulty conclusion or cause**, derived, from grade 7: Cook, Ellerton and Kinkead (2018), IGLU 2021.
        - **Opinion presented as fact**, derived, from grade 7: IGLU 2021, Voss, Carstensen and Bos (2005), KMK standards.
        - **False authority or source**, derived, from grade 10: Cook, Lewandowsky and Ecker (2017).
        - **Loaded, emotional wording**, derived, from grade 10: IGLU 2021, KMK standards, Cook and others (2017).

        What we cannot back up:

        - That this exercise improves reading skills. There is no study for it.
        - That finding errors in texts trains checking unknown web pages. That is something else (Wineburg and McGrew 2018).
        - The length and sentence structure of the texts for each grade: these are settings of the authors.
        - The spelling mistakes are constructed for the words of the texts. The kinds of mistake come from the IQB materials; we did not collect the individual misspellings of learners. In English texts we carried over the same kinds; this is our own adaptation and no source names it.
