# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title:
  de: Textcheck
  en: Textcheck
description:
  de: |
    Hier übst du, genau zu lesen. Du siehst ein Original und eine Variante davon. In der Variante stecken Fehler. Finde sie
    und markiere sie. Für Schülerinnen und Schüler ab Klasse 3 bis zum Abitur. Die Texte und die Fehler werden mit der
    Klassenstufe schwieriger.
  en: |
    Here you practise careful reading. You see an original text and a variant of it. The variant hides errors. Find them and mark them. For pupils from grade 3 to the Abitur in the German school system. The texts and the errors get harder with the grade.
howto:
  de: |
    - Lies das Original. Es stimmt und nennt seine Quelle.
    - Lies die Variante und markiere die Wörter, die nicht stimmen. Du markierst mit einem Klick oder Tipp, mit der Tastatur
      wählst du Wörter mit den Pfeiltasten und markierst mit der Leertaste.
    - Tippe auf „Prüfen“. Du siehst, welche Fehler du gefunden hast, welche nicht, und warum.
    - Zu jedem Text gibt es drei Arten zu üben. Beim ersten siehst du das Original. Bei „mit der Quelle als PDF“ öffnest du die Quelle als PDF und vergleichst. Bei „Original erkennen“ siehst du zwei Texte, A und B: Du wählst den Text mit den Fehlern und markierst sie dort.
    - Ein paar Wörter zu viel zu markieren ist nicht schlimm, wenn sie direkt neben einem langen Fehler im selben Satz stehen.
  en: |
    - Read the original. It is correct and names its source.
    - Read the variant and mark the words that are wrong. You mark with a click or a tap; with the keyboard you choose words with the arrow keys and mark with the space bar.
    - Tap "Check". You see which errors you found, which you missed, and why they are wrong.
    - Every text has three ways to practise. In the first you see the original. With "the source as PDF" you open the source as a PDF and compare. With "Spot the original" you see two texts, A and B: you choose the text with the errors and mark them there.
    - It is fine to mark a few extra words if they stand right next to a long error in the same sentence.
competencies:
  - de: Ich kann falsch geschriebene Wörter in einem kurzen Text finden und markieren.
    en: I can find misspelt words in a short text and mark them.
  - de: Ich kann Stellen markieren, an denen die Variante dem Original widerspricht.
    en: I can mark places where the variant contradicts the original.
  - de: Ich kann Sätze finden, die sich im selben Text widersprechen.
    en: I can find sentences that contradict each other in the same text.
  - de: Ich kann eine falsche Zeit-, Orts- oder Mengenangabe mit dem Original abgleichen.
    en: I can compare a wrong time, place or amount with the original.
  - de: Ich kann falsch geschriebene Wörter finden, auch solche, die ein Rechtschreibprogramm nicht findet.
    en: I can find misspelt words, even ones a spell checker does not find.
  - de: Ich kann eine Meinung von einer Tatsache unterscheiden und die Meinung markieren.
    en: I can tell an opinion from a fact and mark the opinion.
  - de: Ich kann eine Folgerung erkennen, die der Text nicht trägt.
    en: I can recognise a conclusion that the text does not support.
  - de: Ich kann wertende oder emotionalisierende Formulierungen erkennen.
    en: I can recognise judging or emotional wording.
  - de: Ich kann einen Text mit seiner Quelle vergleichen und Stellen finden, die von der Quelle abweichen.
    en: I can compare a text with its source and find places that differ from the source.
  - de: Ich kann zwei Texte vergleichen und erkennen, welcher Fehler hat.
    en: I can compare two texts and tell which one has errors.
languages:
  - de
  - en
