original:
- text: Die Strandmaus lebt in den Dünen der Nordsee-Inseln.
- text: Sie wird etwa 9 Zentimeter lang und wiegt 25 Gramm.
- text: Tagsüber versteckt sie sich in Erdgängen, weil Möwen sie sonst fangen würden.
- text: In der Dämmerung sucht sie Samen und kleine Käfer.
- text: Im Winter hält sie keinen Winterschlaf, sondern sammelt Vorräte.
- text: Forschende zählen jedes Jahr im Mai etwa 400 Tiere auf der Insel.
