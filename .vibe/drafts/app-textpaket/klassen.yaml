# Fehlerklassen (Entwurf). Gleiche Liste wie im Plan, Abschnitt Fehlerklassen.
# ab_klasse ist eine Einstellung, keine Quelle. status: belegt = Quelle nennt die Fehlerart, abgeleitet = eigener Schluss.
# basis_typisch: übliche Erkennungsbasis (text, vergleich, vorwissen); eine Variante darf davon abweichen, das gibt eine Warnung.
rechtschreibung_regel:
  name: Rechtschreibung (Regelfehler)
  familie: A Form
  status: belegt
  basis_typisch:
  - text
  ab_klasse: 3
  quelle: IQB-Lernaufgabe (AFRA-Liste), IQB-Handreichung Fehlerschwerpunkte; KMK Primar Fehleraufmerksamkeit
