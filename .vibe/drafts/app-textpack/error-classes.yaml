  family: form
  status: documented
  statusNote: belegt
  usualBasis:
    - text
  fromGrade: 5
  languages:
    - de
  source: IQB-Handreichung (das/dass), IQB-Lernaufgabe (Rechtschreibprogramm übersieht Substantivierungen)
