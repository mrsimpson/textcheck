# Error classes (draft). Same list as in the plan, section "Fehlerklassen".
# status: documented = a source we read names this kind of error; derived = our own inference.
# statusNote keeps the German wording of the plan. fromGrade is a setting, not a finding.
# languages: where the class has been considered. Spelling classes follow German orthography (AFRA, IQB); other languages need their own review.
# Learner-facing names live in the message files (messages.de.json), not here.
spelling_rule:
  family: form
  status: documented
  statusNote: belegt
  usualBasis:
    - text
  fromGrade: 3
  languages:
    - de
  source: IQB-Lernaufgabe (AFRA-Liste), IQB-Handreichung Fehlerschwerpunkte; KMK Primar Fehleraufmerksamkeit
slip:
  family: form
  status: documented
  statusNote: belegt
  usualBasis:
    - text
  fromGrade: 3
  languages:
    - de
  source: Schmellentin & Lindauer 2019 (Regel- und Flüchtigkeitsfehler trennen); Unterart Wort doppelt oder fehlt abgeleitet
