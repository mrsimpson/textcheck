summary: >-
  Du liest ein Original und eine Variante davon und markierst die Wörter, die in der Variante nicht stimmen:
  von Rechtschreibfehlern bis zu Meinungen, die wie Tatsachen klingen. Du kannst dazu die Quelle als PDF
  nutzen oder zwei Texte vergleichen und den mit den Fehlern finden. Die Texte werden mit der Klasse länger
  und schwieriger. Nach dem Prüfen siehst du, welche Fehler du gefunden hast, und warum sie falsch sind.
